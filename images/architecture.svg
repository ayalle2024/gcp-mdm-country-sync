<?xml version="1.0" encoding="UTF-8"?>
<svg width="1320" height="1500" viewBox="0 0 1320 1500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#5f6368"/>
    </marker>
    <marker id="arBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#1A73E8"/>
    </marker>
    <marker id="arExt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#D93025"/>
    </marker>
  </defs>

  <rect width="1320" height="1500" fill="#ffffff"/>

  <!-- Title -->
  <text x="660" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#202124">GCP MDM Countries Sync — Architecture</text>
  <text x="660" y="58" text-anchor="middle" font-size="13" fill="#5f6368">Workflow-orchestrated master data management · change detection · single write path (CRUD API) · Pub/Sub events · least-privilege IAM</text>

  <!-- ===== GCP container ===== -->
  <rect x="250" y="88" width="810" height="1212" rx="20" fill="#F8F9FA" stroke="#9AA0A6" stroke-width="1.2"/>
  <text x="272" y="114" font-size="14" font-weight="bold" fill="#202124">Google Cloud</text>
  <text x="372" y="114" font-size="12" fill="#5f6368">project arl-dtpr-dev-mdm-country-sync · us-central1 · BigQuery US</text>

  <!-- ===== Workflow ===== -->
  <rect x="280" y="125" width="730" height="120" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.3"/>
  <text x="300" y="150" font-size="14" font-weight="bold" fill="#174EA6">Cloud Workflows</text>
  <text x="422" y="150" font-size="11" fill="#174EA6">orquestador-mdm-country-sync</text>
  <text x="990" y="150" text-anchor="end" font-size="10" font-style="italic" fill="#5f6368">manual · Execute button</text>
  <text x="300" y="180" font-size="11.5" fill="#202124">1. POST (OIDC) to cr-mdm-ingest-country and assert body.status == "success"</text>
  <text x="300" y="201" font-size="11.5" fill="#202124">2. Start sq_detect_country_changes and poll every 10 s → SUCCEEDED</text>
  <text x="300" y="222" font-size="11.5" fill="#202124">3. POST (OIDC) to cf-update-mdm-country with {since: run start}, which sends this run's changes to the CRUD API</text>

  <!-- ===== External: countries.dev ===== -->
  <rect x="30" y="330" width="190" height="80" rx="10" fill="#FCE8E6" stroke="#D93025" stroke-width="1.3"/>
  <text x="125" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#A50E0E">countries.dev API</text>
  <text x="125" y="377" text-anchor="middle" font-size="11" fill="#A50E0E">Public REST API, no key</text>
  <text x="125" y="394" text-anchor="middle" font-size="11" fill="#A50E0E">250 countries per run</text>
  <line x1="220" y1="360" x2="288" y2="360" stroke="#D93025" stroke-width="1.6" marker-end="url(#arExt)"/>
  <text x="254" y="352" text-anchor="middle" font-size="10" font-weight="bold" fill="#A50E0E">GET</text>

  <!-- ===== Legend ===== -->
  <text x="30" y="470" font-size="12" font-weight="bold" fill="#202124">Legend</text>
  <rect x="30" y="482" width="16" height="16" rx="3" fill="#E8F0FE" stroke="#1A73E8"/>
  <text x="54" y="495" font-size="11" fill="#3c4043">Orchestration / compute</text>
  <rect x="30" y="506" width="16" height="16" rx="3" fill="#F3E8FD" stroke="#9334E6"/>
  <text x="54" y="519" font-size="11" fill="#3c4043">Pub/Sub topic</text>
  <rect x="30" y="530" width="16" height="16" rx="3" fill="#FEF7E0" stroke="#E37400"/>
  <text x="54" y="543" font-size="11" fill="#3c4043">BigQuery (raw layer)</text>
  <rect x="30" y="554" width="16" height="16" rx="3" fill="#E4F7F8" stroke="#12A4AF"/>
  <text x="54" y="567" font-size="11" fill="#3c4043">BigQuery (standard layer)</text>
  <rect x="30" y="578" width="16" height="16" rx="3" fill="#E6F4EA" stroke="#1E8E3E"/>
  <text x="54" y="591" font-size="11" fill="#3c4043">Firestore (live master)</text>
  <rect x="30" y="602" width="16" height="16" rx="3" fill="#FCE8E6" stroke="#D93025"/>
  <text x="54" y="615" font-size="11" fill="#3c4043">External interface</text>
  <line x1="30" y1="638" x2="46" y2="638" stroke="#1A73E8" stroke-width="1.6"/>
  <text x="54" y="642" font-size="11" fill="#3c4043">Control (trigger / poll)</text>
  <line x1="30" y1="660" x2="46" y2="660" stroke="#5f6368" stroke-width="1.6"/>
  <text x="54" y="664" font-size="11" fill="#3c4043">Data / event flow</text>
  <line x1="30" y1="682" x2="46" y2="682" stroke="#5f6368" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="54" y="686" font-size="11" fill="#3c4043">Reads</text>

  <!-- ===== Workflow control lane (right) ===== -->
  <path d="M1010 185 L1030 185 L1030 840" fill="none" stroke="#1A73E8" stroke-width="1.6"/>
  <line x1="1030" y1="345" x2="592" y2="345" stroke="#1A73E8" stroke-width="1.6" marker-end="url(#arBlue)"/>
  <circle cx="612" cy="345" r="9" fill="#1A73E8"/>
  <text x="612" y="349" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">1</text>
  <line x1="1030" y1="580" x2="592" y2="580" stroke="#1A73E8" stroke-width="1.6" marker-end="url(#arBlue)"/>
  <circle cx="612" cy="580" r="9" fill="#1A73E8"/>
  <text x="612" y="584" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">2</text>
  <line x1="1030" y1="840" x2="592" y2="840" stroke="#1A73E8" stroke-width="1.6" marker-end="url(#arBlue)"/>
  <circle cx="612" cy="840" r="9" fill="#1A73E8"/>
  <text x="612" y="844" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">3</text>

  <!-- ================= PIPELINE (left lane) ================= -->
  <!-- Cloud Run ingest -->
  <rect x="290" y="300" width="300" height="100" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.3"/>
  <text x="440" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#174EA6">Cloud Run (private)</text>
  <text x="440" y="343" text-anchor="middle" font-size="11" fill="#174EA6">cr-mdm-ingest-country</text>
  <text x="440" y="362" text-anchor="middle" font-size="11" fill="#202124">fetch → clean → validate → insert</text>
  <text x="440" y="380" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">Python · Flask · 17 tests</text>

  <line x1="440" y1="400" x2="440" y2="428" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- raw country_raw -->
  <rect x="290" y="430" width="300" height="70" rx="10" fill="#FEF7E0" stroke="#E37400" stroke-width="1.3"/>
  <text x="440" y="454" text-anchor="middle" font-size="13" font-weight="bold" fill="#7A4100">BigQuery · raw</text>
  <text x="440" y="473" text-anchor="middle" font-size="10.5" fill="#7A4100">country_raw</text>
  <text x="440" y="490" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">one row per country per run</text>

  <line x1="440" y1="500" x2="440" y2="528" stroke="#5f6368" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="450" y="518" font-size="10" fill="#5f6368">reads</text>

  <!-- Scheduled Query -->
  <rect x="290" y="530" width="300" height="100" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.3"/>
  <text x="440" y="554" text-anchor="middle" font-size="13" font-weight="bold" fill="#174EA6">BigQuery Scheduled Query</text>
  <text x="440" y="573" text-anchor="middle" font-size="10.5" fill="#174EA6">sq_detect_country_changes</text>
  <text x="440" y="592" text-anchor="middle" font-size="10.5" fill="#202124">on-demand · INSERT + MERGE in one transaction</text>
  <text x="440" y="610" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">IS DISTINCT FROM (NULL-safe)</text>

  <!-- bus to the two std tables -->
  <path d="M440 630 L440 650" fill="none" stroke="#5f6368" stroke-width="1.6"/>
  <path d="M362 650 L517 650" fill="none" stroke="#5f6368" stroke-width="1.6"/>
  <line x1="362" y1="650" x2="362" y2="668" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="517" y1="650" x2="517" y2="668" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="290" y="670" width="145" height="80" rx="10" fill="#E4F7F8" stroke="#12A4AF" stroke-width="1.3"/>
  <text x="362" y="694" text-anchor="middle" font-size="12" font-weight="bold" fill="#0B5C63">BigQuery · std</text>
  <text x="362" y="713" text-anchor="middle" font-size="10" fill="#0B5C63">ori_ref_country</text>
  <text x="362" y="732" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">current snapshot</text>

  <rect x="445" y="670" width="145" height="80" rx="10" fill="#E4F7F8" stroke="#12A4AF" stroke-width="1.3"/>
  <text x="517" y="694" text-anchor="middle" font-size="12" font-weight="bold" fill="#0B5C63">BigQuery · std</text>
  <text x="517" y="713" text-anchor="middle" font-size="10" fill="#0B5C63">trx_country_change</text>
  <text x="517" y="732" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">INSERT / UPDATE audit</text>

  <!-- trx_country_change -> cf-update (reads) -->
  <line x1="517" y1="750" x2="517" y2="788" stroke="#5f6368" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="527" y="774" font-size="10" fill="#5f6368">reads</text>

  <!-- cf-update-mdm-country -->
  <rect x="290" y="790" width="300" height="100" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.3"/>
  <text x="440" y="814" text-anchor="middle" font-size="14" font-weight="bold" fill="#174EA6">Cloud Function (gen2, HTTP)</text>
  <text x="440" y="833" text-anchor="middle" font-size="11" fill="#174EA6">cf-update-mdm-country</text>
  <text x="440" y="852" text-anchor="middle" font-size="11" fill="#202124">this run's changes (since) → POST /sync/countries</text>
  <text x="440" y="870" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">OIDC · batches of 100 · 22 tests</text>

  <!-- cf-update -> CRUD -->
  <line x1="440" y1="890" x2="440" y2="928" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="450" y="914" font-size="10" fill="#5f6368">sends changes</text>

  <!-- ================= CRUD (single write path) ================= -->
  <rect x="290" y="930" width="300" height="100" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2.2"/>
  <text x="440" y="954" text-anchor="middle" font-size="14" font-weight="bold" fill="#174EA6">Cloud Run (private)</text>
  <text x="440" y="973" text-anchor="middle" font-size="11" fill="#174EA6">cr-crud-mdm-country-api</text>
  <text x="440" y="992" text-anchor="middle" font-size="11" fill="#202124">single write path · idempotent</text>
  <text x="440" y="1010" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">NO_CHANGE = no write, no event · 70 tests</text>

  <!-- Manual client -->
  <line x1="1088" y1="975" x2="592" y2="975" stroke="#D93025" stroke-width="1.6" marker-end="url(#arExt)"/>
  <text x="840" y="967" text-anchor="middle" font-size="10" fill="#A50E0E">GET / POST / PUT / DELETE /countries</text>
  <rect x="1090" y="935" width="200" height="80" rx="10" fill="#FCE8E6" stroke="#D93025" stroke-width="1.3"/>
  <text x="1190" y="962" text-anchor="middle" font-size="13" font-weight="bold" fill="#A50E0E">Manual client</text>
  <text x="1190" y="981" text-anchor="middle" font-size="11" fill="#A50E0E">curl / API consumer</text>
  <text x="1190" y="999" text-anchor="middle" font-size="10" font-style="italic" fill="#A50E0E">same API, same treatment</text>

  <!-- CRUD -> Firestore + audit (bus) -->
  <path d="M440 1030 L440 1055" fill="none" stroke="#5f6368" stroke-width="1.6"/>
  <path d="M362 1055 L517 1055" fill="none" stroke="#5f6368" stroke-width="1.6"/>
  <line x1="362" y1="1055" x2="362" y2="1078" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="517" y1="1055" x2="517" y2="1078" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="290" y="1080" width="145" height="80" rx="10" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.3"/>
  <text x="362" y="1104" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D5323">Firestore</text>
  <text x="362" y="1123" text-anchor="middle" font-size="10" fill="#0D5323">countries</text>
  <text x="362" y="1142" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">live master</text>

  <rect x="445" y="1080" width="145" height="80" rx="10" fill="#E4F7F8" stroke="#12A4AF" stroke-width="1.3"/>
  <text x="517" y="1104" text-anchor="middle" font-size="12" font-weight="bold" fill="#0B5C63">BigQuery · std</text>
  <text x="517" y="1123" text-anchor="middle" font-size="10" fill="#0B5C63">trx_crud_action</text>
  <text x="517" y="1142" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">audit: result, caller</text>

  <!-- CRUD -> Pub/Sub -->
  <path d="M590 1010 L640 1010 L640 1120 L688 1120" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="648" y="1064" font-size="10" fill="#5f6368">1 event per</text>
  <text x="648" y="1077" font-size="10" fill="#5f6368">real change</text>

  <rect x="690" y="1080" width="290" height="80" rx="10" fill="#F3E8FD" stroke="#9334E6" stroke-width="1.3"/>
  <text x="835" y="1104" text-anchor="middle" font-size="13" font-weight="bold" fill="#5B1F94">Pub/Sub topic</text>
  <text x="835" y="1123" text-anchor="middle" font-size="11" fill="#5B1F94">mdm-country-updates</text>
  <text x="835" y="1142" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">INSERT / UPDATE / DELETE + source</text>

  <!-- Pub/Sub -> cf-notify -->
  <line x1="835" y1="1160" x2="835" y2="1198" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="845" y="1184" font-size="10" fill="#5f6368">Eventarc trigger</text>

  <rect x="690" y="1200" width="290" height="80" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.3"/>
  <text x="835" y="1224" text-anchor="middle" font-size="14" font-weight="bold" fill="#174EA6">Cloud Function (gen2)</text>
  <text x="835" y="1243" text-anchor="middle" font-size="11" fill="#174EA6">cf-notify-downstream</text>
  <text x="835" y="1262" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">POST to the webhook · 9 tests</text>

  <!-- Webhook downstream -->
  <line x1="980" y1="1240" x2="1088" y2="1240" stroke="#D93025" stroke-width="1.6" marker-end="url(#arExt)"/>
  <text x="1034" y="1232" text-anchor="middle" font-size="10" font-weight="bold" fill="#A50E0E">POST</text>
  <rect x="1090" y="1200" width="200" height="80" rx="10" fill="#FCE8E6" stroke="#D93025" stroke-width="1.3"/>
  <text x="1190" y="1227" text-anchor="middle" font-size="13" font-weight="bold" fill="#A50E0E">Downstream system</text>
  <text x="1190" y="1246" text-anchor="middle" font-size="11" fill="#A50E0E">simulated · webhook.site</text>
  <text x="1190" y="1264" text-anchor="middle" font-size="10" font-style="italic" fill="#A50E0E">50-request cap per URL</text>

  <!-- ===== IAM band ===== -->
  <text x="30" y="1342" font-size="14" font-weight="bold" fill="#202124">Runtime identities</text>
  <text x="170" y="1342" font-size="12" fill="#5f6368">one service account per component type · least privilege · default Compute and App Engine accounts without roles</text>

  <g font-size="10.5">
    <rect x="30" y="1356" width="222" height="104" rx="8" fill="#ffffff" stroke="#9AA0A6"/>
    <text x="42" y="1376" font-size="12" font-weight="bold" fill="#202124">Cloud Workflows</text>
    <text x="42" y="1394" fill="#174EA6">sa-workflow-mdmsync</text>
    <text x="42" y="1412" fill="#3c4043">run.invoker (2 services)</text>
    <text x="42" y="1428" fill="#3c4043">custom role mdmTransferRunner</text>
    <text x="42" y="1444" fill="#3c4043">logging.logWriter</text>

    <rect x="264" y="1356" width="222" height="104" rx="8" fill="#ffffff" stroke="#9AA0A6"/>
    <text x="276" y="1376" font-size="12" font-weight="bold" fill="#202124">Cloud Run (2)</text>
    <text x="276" y="1394" fill="#174EA6">sa-cloudrun-mdmsync</text>
    <text x="276" y="1412" fill="#3c4043">bigquery.dataEditor (raw + std)</text>
    <text x="276" y="1428" fill="#3c4043">jobUser · datastore.user · logWriter</text>
    <text x="276" y="1444" fill="#3c4043">pubsub.publisher (topic)</text>

    <rect x="498" y="1356" width="222" height="104" rx="8" fill="#ffffff" stroke="#9AA0A6"/>
    <text x="510" y="1376" font-size="12" font-weight="bold" fill="#202124">Cloud Functions (2)</text>
    <text x="510" y="1394" fill="#174EA6">sa-cloudfunction-mdmsync</text>
    <text x="510" y="1412" fill="#3c4043">bigquery.dataViewer (std)</text>
    <text x="510" y="1428" fill="#3c4043">jobUser · logWriter</text>
    <text x="510" y="1444" fill="#3c4043">run.invoker (notify + CRUD)</text>

    <rect x="732" y="1356" width="222" height="104" rx="8" fill="#ffffff" stroke="#9AA0A6"/>
    <text x="744" y="1376" font-size="12" font-weight="bold" fill="#202124">Scheduled Query</text>
    <text x="744" y="1394" fill="#174EA6">sa-scheduledquery-mdmsync</text>
    <text x="744" y="1412" fill="#3c4043">bigquery.jobUser</text>
    <text x="744" y="1428" fill="#3c4043">dataViewer (raw)</text>
    <text x="744" y="1444" fill="#3c4043">dataEditor (std)</text>

    <rect x="966" y="1356" width="222" height="104" rx="8" fill="#ffffff" stroke="#9AA0A6"/>
    <text x="978" y="1376" font-size="12" font-weight="bold" fill="#202124">Cloud Build (deploy)</text>
    <text x="978" y="1394" fill="#174EA6">sa-cloudbuild-mdmsync</text>
    <text x="978" y="1412" fill="#3c4043">run.builder</text>
    <text x="978" y="1428" fill="#3c4043">(Cloud Run and Functions builds)</text>
  </g>

  <text x="660" y="1488" text-anchor="middle" font-size="12" fill="#5f6368">12 components · 250 countries per run · $0/month on the GCP free tier · scales to zero · all config via environment variables</text>
</svg>
