# Variables de entorno del Workflow orquestador-mdm-country-sync.
# Se cargan en la consola al crearlo (sección "Environment variables"), una
# por una: nombre = clave, valor = el de este archivo. El YAML las lee con
# sys.get_env("clave"); no hay nada hardcodeado en orquestador-mdm-country-sync.yaml.
# Los valores entre <> son propios del proyecto: reemplazarlos por los reales.
project_id: arl-dtpr-dev-mdm-country-sync
project_number: "<PROJECT_NUMBER>"
region: us-central1
transfer_location: us
cloud_run_service_name: cr-mdm-ingest-country
transfer_config_id: "<ID_SQ_DETECT_COUNTRY_CHANGES>"
poll_interval_seconds: "10"
cf_update_mdm_country_url: "<URL_CF_UPDATE_MDM_COUNTRY>"
